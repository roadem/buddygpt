// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    ext {
        agp_version = '7.2.2'
    }
    repositories {
        google()
        jcenter()
        mavenCentral()
        maven { url 'https://maven.google.com' }

    }
    dependencies {
        classpath "com.android.tools.build:gradle:$agp_version"
        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }

    def gradlecredentials = "credentials.gradle"
    if (project.file(gradlecredentials).exists()){
        apply from: gradlecredentials
    }
}
plugins {
    id 'com.chaquo.python' version '12.0.1' apply false
    id "org.sonarqube" version "4.2.1.3168"
}
allprojects {
    repositories {
        google()
        jcenter()
        mavenCentral()
        maven { url "https://jitpack.io" }
        maven { url 'https://maven.google.com' }
        maven { url "https://bluefrogrobotics.jfrog.io/artifactory/bluefrogrobotics-libs-release-local/"
            credentials{
                username "aevaweb-boris" // NOTE: Do not commit !
                password "7S9gS6K&#w18Im" // NOTE: Do not commit !
            }
        }

    }
}
sonarqube {
    properties {
        property "sonar.projectName", "buddygpt"
        property "sonar.projectKey", "buddygpt"
        property "sonar.host.url", "http://localhost:9000"
        property "sonar.token", "sqp_007f714ca398f04166bd11cc349cd94c0d4e0b49"
    }
}
